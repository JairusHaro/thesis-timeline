<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thesis Timeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Thesis Timeline</a>
    <nav>
      <a class="active" href="index.html">Timeline</a>
      <a href="leader.html">Leader Dashboard</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <p class="eyebrow">THESIS PROJECT</p>
      <h1>Project Timeline</h1>
      <p>Shared tasks and progress update in real time.</p>
    </div>
  </section>

  <main class="container">
    <section class="connection-card">
      <span id="connectionDot" class="dot"></span>
      <span id="connectionText">Connecting…</span>
    </section>

    <section class="toolbar">
      <div>
        <h2>Timeline</h2>
        <p>Click a task to view its details.</p>
      </div>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="Search task or member">
        <select id="statusFilter">
          <option value="all">All status</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </section>

    <section id="timeline" class="timeline"></section>
    <section id="emptyState" class="empty hidden">
      <h3>No tasks found</h3>
    </section>
  </main>

  <dialog id="viewDialog">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="viewTitle">Task</h2>
        <button id="closeView" class="icon-btn">×</button>
      </div>
      <div id="viewContent"></div>
    </div>
  </dialog>

  <script type="module" src="timeline.js"></script>
</body>
</html>
